plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = '1.0.2.1'
group = 'dev.pota.numismaticcompat'

base {
    archivesName = 'pota-numismatic-keepinventory-compat'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://maven.wispforest.io/releases' }

    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'

    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'

    // Exact PotA target: Numismatic Overhaul 0.2.18+1.20 (Modrinth version nMuxLkSq).
    modImplementation 'maven.modrinth:ZXm8hVxN:nMuxLkSq'

    // Numismatic embeds Cardinal Components at runtime; expose its API to javac explicitly.
    modCompileOnly 'dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.1'
    modCompileOnly 'dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.1'

    // Required by Numismatic in a Loom development runtime.
    modLocalRuntime 'io.wispforest:owo-lib:0.11.2+1.20'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
